<!--Sets up the dropdown to change grid size, button to show the next generation, dropdown with pre-defined patterns, and start/reset button-->

<head>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>

    <canvas id="gameCanvas" width="500" height="500" style="border:1px solid #000000;">
    </canvas><br><br>
    <label for="sizeSelect">Grid Size:</label>
    <select id="sizeSelect">
        <option value="20">20x20</option>
        <option value="40">40x40</option>
    </select><br><br>
    <label for="patternSelect">Choose a pattern:</label>
    <select id="patternSelect">
        <option value="default">Glider</option>
        <option value="pattern1">Oscillating Pattern</option>
        <option value="beacon">Beacon</option>
        <option value="blinker">Blinker</option>
        <option value="smallSpaceship">Light-weight Spaceship</option>
        <option value="acorn">Acorn</option>
        <option value="pentomino">The R-Pentomino</option>
    </select>
    <button id="startReset">Reset</button><br><br>
    <button id="next">Next</button> <br><br>

    <script src="js/script.js"></script>

</body>
